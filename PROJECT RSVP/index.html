<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aplikasi To-Do List</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Arial, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #667eea, #764ba2);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      background: #fff;
      width: 100%;
      max-width: 420px;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
      color: #333;
      font-size: 24px;
    }

    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    input {
      flex: 1;
      padding: 12px;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
      transition: 0.2s;
    }

    input:focus {
      outline: none;
      border-color: #667eea;
    }

    button {
      padding: 12px 20px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
      transition: 0.2s;
    }

    button:hover {
      background: #5568d3;
    }

    ul {
      list-style: none;
    }

    li {
      padding: 12px 14px;
      background: #f4f4f8;
      margin-bottom: 8px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      transition: 0.2s;
      word-break: break-word;
    }

    li:hover {
      background: #e8e8f0;
    }

    li.done span {
      text-decoration: line-through;
      opacity: 0.5;
    }

    .delete-btn {
      background: #e74c3c;
      padding: 6px 10px;
      font-size: 13px;
      border-radius: 6px;
    }

    .delete-btn:hover {
      background: #c0392b;
    }

    .empty {
      text-align: center;
      color: #999;
      font-style: italic;
      padding: 10px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>📝 To-Do List Saya</h1>

    <div class="input-group">
      <input type="text" id="taskInput" placeholder="Tulis tugas baru...">
      <button onclick="addTask()">Tambah</button>
    </div>

    <ul id="taskList">
      <li class="empty" id="emptyMsg">Belum ada tugas 🎉</li>
    </ul>
  </div>

  <script>
    const taskInput = document.getElementById('taskInput');
    const taskList = document.getElementById('taskList');
    const emptyMsg = document.getElementById('emptyMsg');

    function addTask() {
      const text = taskInput.value.trim();
      if (text === '') return;

      if (emptyMsg) emptyMsg.remove();

      const li = document.createElement('li');

      const span = document.createElement('span');
      span.textContent = text;
      span.onclick = () => li.classList.toggle('done');

      const btn = document.createElement('button');
      btn.textContent = '✕';
      btn.className = 'delete-btn';
      btn.onclick = (e) => {
        e.stopPropagation();
        li.remove();
        if (taskList.children.length === 0) {
          const msg = document.createElement('li');
          msg.className = 'empty';
          msg.id = 'emptyMsg';
          msg.textContent = 'Belum ada tugas 🎉';
          taskList.appendChild(msg);
        }
      };

      li.appendChild(span);
      li.appendChild(btn);
      taskList.appendChild(li);

      taskInput.value = '';
      taskInput.focus();
    }

    // Tambah dengan tekan Enter
    taskInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') addTask();
    });
  </script>

</body>
</html>
